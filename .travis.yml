language: node_js
node_js:
  - "stable"
cache:
  directories:
    - node_modules
before_install:
  - curl -o- -L https://yarnpkg.com/install.sh | bash -s -- --version 1.22.5
  - export PATH="$HOME/.yarn/bin:$PATH"
install:
  - yarn
cache:
  yarn: true
  directories:
    - node_modules
script:
  - yarn test --coverage
  - yarn run build
